- name: Apply HyperOS Patches & Find Config
        run: |
          cd kernel_source
          
          # Find any file ending with defconfig that matches vili or a similar pattern
          CONFIG_FILE=$(find arch/arm64/configs -name "*defconfig" | grep -E "vili|sm8350|kona" | head -n 1)
          if [ -z "$CONFIG_FILE" ]; then
            CONFIG_FILE=$(find arch/arm64/configs -name "*defconfig" | head -n 1)
          fi
          
          echo "Found Config: $CONFIG_FILE"
          CONFIG_NAME=$(basename "$CONFIG_FILE")
          echo "CONFIG_NAME=$CONFIG_NAME" >> $GITHUB_ENV
          
          # Injecting HyperOS / MIUI hooks
          echo "CONFIG_MIUI_CAMERA=y" >> "$CONFIG_FILE"
          echo "CONFIG_SND_SOC_MSM_SDW=y" >> "$CONFIG_FILE"
          echo "CONFIG_BINDER_IPC_SYSTEM_HEAP=y" >> "$CONFIG_FILE"

          if [ -f "arch/arm64/Makefile" ]; then
            sed -i 's/-mcpu=cortex-a78.cortex-a55+crypto+crc/-mcpu=cortex-a78/g' arch/arm64/Makefile || true
          fi

      - name: Compile Kernel Images
        run: |
          cd kernel_source
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          
          mkdir -p out
          make O=out ${{ env.CONFIG_NAME }}
          
          make -j$(nproc) O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="-HyperOS-Vili-NextGen" \
            Image.gz dtbo.img
